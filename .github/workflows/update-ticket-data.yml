name: Update official ticket data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: premier-ticket-tracker-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official ticket sources
        run: python scripts/update_tickets.py
      - name: Validate ticket data
        run: python -c "import json; json.load(open('tickets.json',encoding='utf-8')); json.load(open('last-audit.json',encoding='utf-8')); print('JSON OK')"
      - name: Upload current audit
        uses: actions/upload-artifact@v4
        with:
          name: ticket-audit-${{ github.run_number }}
          path: last-audit.json
          retention-days: 7
      - name: Commit verified ticket changes
        run: |
          if git diff --quiet -- tickets.json; then
            echo "No verified ticket changes; no deployment commit."
            exit 0
          fi
          git config user.name "Premier Ticket Tracker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tickets.json last-audit.json
          git commit -m "chore: verified ticket refresh"
          git push
