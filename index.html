<title>Premier Ticket Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f6f7fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 80px}h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.055em;margin:0}
.sub{color:#8f98a8;margin:10px 0 24px}.bar{position:sticky;top:0;z-index:50;background:rgba(9,11,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 0;border-bottom:1px solid #202632;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}.bar-left{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #293140;background:#111620;color:#fff;border-radius:999px;padding:10px 14px;font:inherit}
button.active{background:#fff;color:#090b10}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 26px}
.sum{border:1px solid #242b37;background:#10141b;border-radius:18px;padding:16px}.sum b{font-size:28px;display:block}.sum span{font-size:11px;color:#8f98a8}
.week{margin:30px 0}.weekhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.weekhead h2{font-size:17px;margin:0}.weekhead span{font-size:11px;color:#7f8795}
.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:86px minmax(320px,1.05fr) minmax(430px,1fr) 86px;gap:20px;align-items:center;border:1px solid #242b37;background:#10141b;border-radius:18px;padding:18px 20px;color:inherit}
.game.finished{opacity:.44;filter:grayscale(.75)}.date b{display:block}.date span{font-size:11px;color:#8f98a8}.fixture{min-width:0}
.comp{font-size:11px;letter-spacing:.08em;color:#7f8795;text-transform:uppercase}.fixture h3{margin:5px 0 0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px}.pill{font-size:11px;font-weight:850;border-radius:999px;padding:7px 9px;border:1px solid #303847;white-space:nowrap}
.buy{color:#7de79d;background:rgba(70,200,110,.10)}.exchange{color:#9fc0ff;background:rgba(80,130,255,.12)}.wait{color:#f2cd72;background:rgba(242,205,114,.10)}.closed{color:#8f98a8}.soon{color:#e8bc78;background:rgba(232,188,120,.10)}
.window{border-left:1px solid #27303d;padding:4px 0 4px 26px}.window h4{font-size:18px;color:#f1f3f7;margin:0 0 14px;font-weight:900;letter-spacing:-.01em}.window-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.window-state{border:1px solid #2c3442;background:#121720;border-radius:14px;padding:12px 13px;min-width:0;min-height:78px}.window-state .label{display:block;font-size:11px;color:#7f8998;margin-bottom:7px;font-weight:700}.window-state .value{display:block;font-size:14px;font-weight:850;line-height:1.35;white-space:normal}.window-state .date-main{display:block;font-size:15px;font-weight:900;line-height:1.15}.window-state .time-sub{display:block;font-size:11px;margin-top:5px;opacity:.85;font-weight:750}.state-wait{color:#f2cd72;background:rgba(242,205,114,.06)}.state-open{color:#7de79d;background:rgba(70,200,110,.07)}.state-closed{color:#9aa3b2;background:rgba(154,163,178,.05)}.state-result{color:#b9a2ff;background:rgba(130,105,255,.07)}.state-na{color:#7f8795;background:#11151c}.window p{font-size:11px;color:#7f8795;line-height:1.5;margin:10px 2px 0}.ended-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #303847;background:#121720;border-radius:12px;padding:13px 14px}.ended-title{font-size:16px;font-weight:900;color:#d4d9e2}.exchange-state{font-size:12px;font-weight:850;border-radius:999px;padding:7px 10px;white-space:nowrap}.exchange-open{color:#9fc0ff;background:rgba(80,130,255,.12);border:1px solid rgba(80,130,255,.24)}.exchange-check{color:#f2cd72;background:rgba(242,205,114,.08);border:1px solid rgba(242,205,114,.18)}
.actions{display:flex;align-items:center;justify-content:flex-end}.official-btn{display:inline-block;text-decoration:none;color:#cfd6e3;font-size:12px;font-weight:800;padding:4px 0;border:0;background:transparent;white-space:nowrap}.official-btn:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}.empty{padding:30px 0;color:#8f98a8}
@media(max-width:1000px){.game{grid-template-columns:74px minmax(230px,1fr) minmax(320px,1fr)}.actions{grid-column:3;justify-content:flex-end}.window{padding-left:18px}.official-btn{margin-left:auto}}

</style>
<style>
  .tracker-clock-wrap{
    margin-left:auto;
    min-width:280px;
    text-align:right;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-end;
    gap:2px;
    padding:8px 0;
  }
  .tracker-clock-date{
    font-size:12px;
    color:#8f98aa;
    font-weight:650;
    letter-spacing:.02em;
  }
  .tracker-clock-time{
    font-size:22px;
    line-height:1;
    font-weight:800;
    color:#f5f7fb;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .tracker-clock-zone{
    font-size:10px;
    color:#646d7d;
    margin-top:2px;
  }
  @media (max-width:860px){
    .tracker-clock-wrap{min-width:auto;align-items:flex-start;text-align:left;padding-top:2px}
    .tracker-clock-time{font-size:24px}
  }
</style>


<style>
.week.nearest-week{
  position:relative;
  border-radius:20px;
  padding:18px 18px 20px;
  margin-left:-18px;
  margin-right:-18px;
  background:linear-gradient(90deg,rgba(89,135,255,.085),rgba(89,135,255,.025) 48%,rgba(255,255,255,.012));
  border:1px solid rgba(118,155,255,.42);
  box-shadow:0 0 0 1px rgba(118,155,255,.08),0 14px 36px rgba(0,0,0,.12);
}
.week.nearest-week::before{
  content:"";
  position:absolute;
  left:-1px;
  top:22px;
  bottom:22px;
  width:3px;
  border-radius:99px;
  background:rgba(133,166,255,.85);
}
.week.nearest-week .weekhead h2{
  color:#f7f9ff;
}
.week.nearest-week .weekhead h2::after{
  content:"当前最近";
  display:inline-flex;
  align-items:center;
  margin-left:10px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  line-height:1;
  font-weight:850;
  color:#d9e2ff;
  background:rgba(116,154,255,.16);
  border:1px solid rgba(116,154,255,.32);
  vertical-align:middle;
}
</style>


<style>
.member-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;

  font-size:10px;
  font-weight:850;
  color:#ffd9dc;
  background:rgba(219,0,7,.10);
  border:1px solid rgba(219,0,7,.22);
  vertical-align:middle;
}
</style>

el.innerHTML=weekKeys.map(w=>`<section class="week ${w===nearestWeek?'nearest-week':''}"><div class="weekhead"><h2>${fmt(w)} 起这一周</h2><span>${groups[w].length} 场</span></div><div class="games">${groups[w].map(x=>`<article class="game ${x.matchStatus==='FINISHED'?'finished':''}"><div class="date"><b>${fmt(x.date)}</b><span>${x.time}</span></div><div class="fixture"><div class="comp">${x.competition}</div><h3>${x.home} <span style="color:#596273">vs</span> ${x.away}</h3><div class="statusline"><span class="pill">${({'UPCOMING':'比赛未开始','FINISHED':'比赛已结束'}[x.matchStatus]||x.matchStatus)}</span><span class="pill ${cls(x.ticketStatus)}">${({'BUY NOW':'现在可买','EXCHANGE OPEN':'Exchange 已开放','APPLICATION CLOSED':'申请已截止','WAITING FOR TICKET INFO':'等待官方票务信息','BALLOT UPCOMING':'今晚开放','BALLOT OPEN':'Ballot 开放中','RESULT PENDING':'等待 Red Ballot 结果','CLOSED':'票务已结束','SOLD OUT':'已售罄','RESULT PENDING':'等待结果','COMING SOON':'即将开售'}[x.ticketStatus]||x.ticketStatus)}</span></div></div><div class="window"><h4>${x.windowType}${x.home==='Arsenal'?'<span class="member-pill">Red会员</span>':''}</h4>${(x.windowType.startsWith('Ballot') && (x.windowOpen==='已结束' || x.windowNote.includes('Ballot 已结束'))) ? `<div class="ended-panel"><span class="ended-title">Ballot 已结束</span><span class="exchange-state ${x.ticketStatus==='EXCHANGE OPEN'?'exchange-open':'exchange-check'}">${x.ticketStatus==='EXCHANGE OPEN'?'Exchange 已开放':'Exchange 状态待确认'}</span></div><p>${x.home==='Arsenal'?(x.ticketStatus==='EXCHANGE OPEN'?'按阿森纳官方票务/Red Member 日历状态；限符合条件会员，实时库存需登录查看':'以阿森纳官方票务/Red Member 日历为准'):(x.ticketStatus==='EXCHANGE OPEN'?'限符合条件会员，实时库存需登录官方票务系统查看':'以俱乐部官方票务页实时状态为准')}</p>` : `<div class="window-grid"><div class="window-state ${wstate(x.windowOpen,'open')}"><span class="label">开放</span><span class="value">${windowValue(x.windowOpen)}</span></div><div class="window-state ${wstate(x.windowClose,'close')}"><span class="label">截止</span><span class="value">${windowValue(x.windowClose)}</span></div><div class="window-state ${wstate(x.resultTime,'result')}"><span class="label">结果</span><span class="value">${windowValue(x.resultTime)}</span></div></div><p>${x.windowNote}</p>`}</div><div class="actions"><a class="official-btn" href="${x.officialUrl}" target="_blank" rel="noreferrer">官方票务</a></div></article>`).join('')}</div></section>`).join('')||'<div class="empty">当前筛选没有比赛</div>';
}

<script>
(function(){
  const dateEl = document.getElementById('trackerClockDate');
  const timeEl = document.getElementById('trackerClockTime');
  const zoneEl = document.getElementById('trackerClockZone');
  if(!dateEl || !timeEl) return;
  function updateClock(){
    const now = new Date();
    const wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    dateEl.textContent = `${y}年${m}月${d}日 · ${wd}`;
    timeEl.textContent = `${hh}:${mm}:${ss}`;
    try{
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      zoneEl.textContent = tz ? `本地时间 · ${tz}` : '本地时间';
    }catch(e){
      zoneEl.textContent = '本地时间';
    }
  }
  updateClock();
  setInterval(updateClock,1000);
})();
</script>
