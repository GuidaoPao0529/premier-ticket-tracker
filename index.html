<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f6f7fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 80px}h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.055em;margin:0}
.sub{color:#8f98a8;margin:10px 0 24px}.bar{position:sticky;top:0;z-index:50;background:rgba(9,11,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 0;border-bottom:1px solid #202632;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}.bar-left{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #293140;background:#111620;color:#fff;border-radius:999px;padding:10px 14px;font:inherit}
button.active{background:#fff;color:#090b10}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 26px}
.sum{border:1px solid #242b37;background:#10141b;border-radius:18px;padding:16px}.sum b{font-size:28px;display:block}.sum span{font-size:11px;color:#8f98a8}
.week{margin:30px 0}.weekhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.weekhead h2{font-size:17px;margin:0}.weekhead span{font-size:11px;color:#7f8795}
.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:86px minmax(320px,1.05fr) minmax(430px,1fr) 86px;gap:20px;align-items:center;border:1px solid #242b37;background:#10141b;border-radius:18px;padding:18px 20px;color:inherit}
.game.finished{opacity:.44;filter:grayscale(.75)}.date b{display:block}.date span{font-size:11px;color:#8f98a8}.fixture{min-width:0}
.comp{font-size:11px;letter-spacing:.08em;color:#7f8795;text-transform:uppercase}.fixture h3{margin:5px 0 0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px}.pill{font-size:11px;font-weight:850;border-radius:999px;padding:7px 9px;border:1px solid #303847;white-space:nowrap}
.buy{color:#7de79d;background:rgba(70,200,110,.10)}.exchange{color:#9fc0ff;background:rgba(80,130,255,.12)}.wait{color:#f2cd72;background:rgba(242,205,114,.10)}.closed{color:#8f98a8}.soon{color:#e8bc78;background:rgba(232,188,120,.10)}
.window{border-left:1px solid #27303d;padding:4px 0 4px 26px}.window h4{font-size:18px;color:#f1f3f7;margin:0 0 14px;font-weight:900;letter-spacing:-.01em}.window-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.window-state{border:1px solid #2c3442;background:#121720;border-radius:14px;padding:12px 13px;min-width:0;min-height:78px}.window-state .label{display:block;font-size:11px;color:#7f8998;margin-bottom:7px;font-weight:700}.window-state .value{display:block;font-size:14px;font-weight:850;line-height:1.35;white-space:normal}.window-state .date-main{display:block;font-size:15px;font-weight:900;line-height:1.15}.window-state .time-sub{display:block;font-size:11px;margin-top:5px;opacity:.85;font-weight:750}.state-wait{color:#f2cd72;background:rgba(242,205,114,.06)}.state-open{color:#7de79d;background:rgba(70,200,110,.07)}.state-closed{color:#9aa3b2;background:rgba(154,163,178,.05)}.state-result{color:#b9a2ff;background:rgba(130,105,255,.07)}.state-na{color:#7f8795;background:#11151c}.window p{font-size:11px;color:#7f8795;line-height:1.5;margin:10px 2px 0}.ended-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #303847;background:#121720;border-radius:12px;padding:13px 14px}.ended-title{font-size:16px;font-weight:900;color:#d4d9e2}.exchange-state{font-size:12px;font-weight:850;border-radius:999px;padding:7px 10px;white-space:nowrap}.exchange-open{color:#9fc0ff;background:rgba(80,130,255,.12);border:1px solid rgba(80,130,255,.24)}.exchange-check{color:#f2cd72;background:rgba(242,205,114,.08);border:1px solid rgba(242,205,114,.18)}
.actions{display:flex;align-items:center;justify-content:flex-end}.official-btn{display:inline-block;text-decoration:none;color:#cfd6e3;font-size:12px;font-weight:800;padding:4px 0;border:0;background:transparent;white-space:nowrap}.official-btn:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}.empty{padding:30px 0;color:#8f98a8}
@media(max-width:1000px){.game{grid-template-columns:74px minmax(230px,1fr) minmax(320px,1fr)}.actions{grid-column:3;justify-content:flex-end}.window{padding-left:18px}.official-btn{margin-left:auto}}
@media(max-width:760px){.bar{grid-template-columns:1fr;gap:10px}.tracker-clock-wrap{align-items:flex-start;text-align:left}.summary{grid-template-columns:1fr 1fr}.game{grid-template-columns:62px minmax(0,1fr);align-items:start}.window{grid-column:2;border-left:0;border-top:1px solid #27303d;padding:14px 0 0}.window-grid{grid-template-columns:1fr}.actions{grid-column:2;justify-content:flex-start}.official-btn{margin-left:0}}

</style>
<style>
  .tracker-clock-wrap{
    margin-left:auto;
    min-width:280px;
    text-align:right;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-end;
    gap:2px;
    padding:8px 0;
  }
  .tracker-clock-date{
    font-size:12px;
    color:#8f98aa;
    font-weight:650;
    letter-spacing:.02em;
  }
  .tracker-clock-time{
    font-size:22px;
    line-height:1;
    font-weight:800;
    color:#f5f7fb;
    letter-spacing:.02em;

  }

  }
  @media (max-width:860px){

</style>


<style>
.week.nearest-week{
  position:relative;
  border-radius:20px;
  padding:18px 18px 20px;
  margin-left:-18px;
  margin-right:-18px;
  background:linear-gradient(90deg,rgba(89,135,255,.085),rgba(89,135,255,.025) 48%,rgba(255,255,255,.012));
  border:1px solid rgba(118,155,255,.42);
  box-shadow:0 0 0 1px rgba(118,155,255,.08),0 14px 36px rgba(0,0,0,.12);
}
.week.nearest-week::before{
  content:"";
  position:absolute;
  left:-1px;
  top:22px;
  bottom:22px;
  width:3px;
  border-radius:99px;
  background:rgba(133,166,255,.85);
}
.week.nearest-week .weekhead h2{
  color:#f7f9ff;
}
.week.nearest-week .weekhead h2::after{
  content:"当前最近";
  display:inline-flex;
  align-items:center;
  margin-left:10px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  line-height:1;
  font-weight:850;
  color:#d9e2ff;
  background:rgba(116,154,255,.16);
  border:1px solid rgba(116,154,255,.32);
  vertical-align:middle;
}
</style>


<style>
.member-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-left:8px;
  padding:3px 7px;
  border-radius:999px;
  font-size:10px;
  font-weight:850;
  color:#ffd9dc;
  background:rgba(219,0,7,.10);
  border:1px solid rgba(219,0,7,.22);
  vertical-align:middle;
}
</style>


<style>
.calendar-notice{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  font-size:11px;font-weight:800;color:#c9d6ff;
}
.calendar-notice::before{
  content:"●";font-size:8px;color:#8aa6ff;
}
</style>

<style>
/* Team crests + competition watermark */
.game{
  grid-template-columns:86px minmax(320px,1.05fr) 112px minmax(430px,1fr) 86px !important;
}
.fixture h3{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  white-space:normal;
  overflow:visible;
}
.team-inline{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-width:0;
}
.team-badge{
  width:29px;
  height:29px;
  object-fit:contain;
  flex:0 0 29px;
  opacity:0;
  transition:opacity .18s ease, transform .18s ease;
}
.team-badge.loaded{opacity:1}
.team-inline:hover .team-badge{transform:scale(1.05)}
.versus{
  color:#596273;
  font-size:13px;
  font-weight:800;
  margin:0 1px;
}
.compmark{
  height:100%;
  min-height:116px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:transparent;
  border-right:1px solid #27303d;
}
.comp-logo{
  display:block;
  width:76px;
  height:76px;
  object-fit:contain;
  opacity:.11;
  filter:grayscale(1);
  user-select:none;
  pointer-events:none;
}
.compmark[data-comp="UEFA Champions League"] .comp-logo{
  width:82px;height:82px;opacity:.09;filter:none;
}
.compmark[data-comp="Carabao Cup"] .comp-logo{
  opacity:.09;
}
.window{
  border-left:0 !important;
  padding-left:22px !important;
}
@media(max-width:1180px){
  .game{
    grid-template-columns:74px minmax(245px,1fr) 82px minmax(320px,1fr) !important;
  }
  .actions{grid-column:4;justify-content:flex-end}
  .comp-logo{width:60px;height:60px}
}
@media(max-width:760px){
  .game{grid-template-columns:62px minmax(0,1fr) !important}
  .compmark{
    grid-column:2;
    min-height:52px;
    justify-content:flex-start;
    border-right:0;
    border-top:1px solid #27303d;
    padding-top:10px;
  }
  .comp-logo{width:46px;height:46px}
  .window{grid-column:2;padding-left:0 !important}
  .actions{grid-column:2}
  .team-badge{width:25px;height:25px;flex-basis:25px}
}
</style>

      if(openMs && closeMs){
        const h48=48*60*60*1000;
        if(nowMs < openMs && openMs-nowMs <= h48){
          x.ticketStatus='BALLOT UPCOMING';
          x.windowNote='Red Member：48小时内开放 Ballot；精确时间以 Arsenal 官方票务页面为准';
        }else if(nowMs >= openMs && nowMs < closeMs){
          x.ticketStatus='BALLOT OPEN';
          x.windowNote='Red Member：Ballot 开放中';
        }else if(nowMs >= closeMs && !['EXCHANGE OPEN','CLOSED'].includes(x.ticketStatus)){
          x.ticketStatus='RESULT PENDING';
          x.windowNote='Red Member：Ballot 已截止，等待 Red Ballot 结果';
        }
      }
    }

    // Chelsea member Application Window lifecycle using exact official dates only.
    if(x.home==='Chelsea' && x.windowType==='Application'){
      const openMs=parseUkTime(x.windowOpen);
      const closeMs=parseUkTime(x.windowClose);
      if(openMs && closeMs){
        const h48=48*60*60*1000;
        if(nowMs < openMs && openMs-nowMs <= h48){
          x.ticketStatus='APPLICATION UPCOMING';
          x.windowNote='Chelsea 会员：48小时内开放 Ticket Application Window';
        }else if(nowMs >= openMs && nowMs < closeMs){
          x.ticketStatus='APPLICATION OPEN';
          x.windowNote='Chelsea 会员：Ticket Application Window 开放中';
        }else if(nowMs >= closeMs && x.matchStatus!=='FINISHED'){
          x.ticketStatus='APPLICATION CLOSED';
          x.windowNote='Chelsea 会员：申请已截止；等待结果或 Ticket Exchange 后续状态';
        }
      }
    }
  });
}

function escAttr(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function teamMarkup(name){
  return `<span class="team-inline"><img class="team-badge" data-team="${escAttr(name)}" alt="${escAttr(name)} 队徽"><span>${name}</span></span>`;
}
function compMark(comp){
  const src=COMP_LOGOS[comp];
  const fallback=comp==='Premier League'
    ? '<div class="comp-fallback">PREMIER<br>LEAGUE</div>'
    : '';
  return `<div class="compmark" data-comp="${escAttr(comp)}">${src?`<img class="comp-logo" src="${src}" alt="${escAttr(comp)} logo" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='block')">`:''}${fallback}</div>`;
}

function render(){
updateDynamicTicketStates();
const nowForFixtures=new Date();
const todayYmd=`${nowForFixtures.getFullYear()}-${String(nowForFixtures.getMonth()+1).padStart(2,'0')}-${String(nowForFixtures.getDate()).padStart(2,'0')}`;
let rows=DATA.filter(x=>
  x.matchStatus!=='FINISHED' &&
  x.date>=todayYmd &&
  (club==='all'||x.home===club) &&
  (comp.value==='all'||x.competition===comp.value) &&
  (ticket.value==='all'||x.ticketStatus===ticket.value)
);
document.getElementById('count').textContent=rows.length;
document.getElementById('action').textContent=rows.filter(x=>['BUY NOW','EXCHANGE OPEN'].includes(x.ticketStatus)).length;
document.getElementById('future').textContent=rows.filter(x=>x.matchStatus==='UPCOMING').length;
let groups={};rows.forEach(x=>(groups[monday(x.date)]??=[]).push(x));
const weekKeys=Object.keys(groups).sort();
const now=new Date();
const todayLocal=new Date(now.getFullYear(),now.getMonth(),now.getDate());
let nearestWeek='';
if(weekKeys.length){
  const currentWeek=weekKeys.find(w=>{
    const start=new Date(w+'T00:00:00');
    const end=new Date(start);
    end.setDate(end.getDate()+6);
    end.setHours(23,59,59,999);
    return todayLocal>=start && todayLocal<=end;
  });
  nearestWeek=currentWeek || weekKeys.reduce((best,w)=>{
    const d=new Date(w+'T00:00:00');
    const bestD=new Date(best+'T00:00:00');
    return Math.abs(d-todayLocal)<Math.abs(bestD-todayLocal)?w:best;
  },weekKeys[0]);
}
const wstate=(v,kind)=>{if(v==='待官方公布')return 'state-wait';if(v==='不适用')return 'state-na';if(kind==='result')return 'state-result';if(/2026|2027/.test(v))return kind==='open'?'state-open':'state-closed';return 'state-result'};

<script>
(function(){
  const dateEl = document.getElementById('trackerClockDate');
  const timeEl = document.getElementById('trackerClockTime');
  const zoneEl = document.getElementById('trackerClockZone');
  if(!dateEl || !timeEl) return;
  function updateClock(){
    const now = new Date();
    const wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    dateEl.textContent = `${y}年${m}月${d}日 · ${wd}`;
    timeEl.textContent = `${hh}:${mm}:${ss}`;
    try{
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      zoneEl.textContent = tz ? `本地时间 · ${tz}` : '本地时间';
    }catch(e){
      zoneEl.textContent = '本地时间';
    }
  }
  updateClock();
  setInterval(updateClock,1000);
})();
</script>


<script>
(function(){
  const API='https://www.thesportsdb.com/api/v1/json/123';
  const CACHE_KEY='ptt-team-badges-v2';
  const aliases={
    'Lille':'LOSC Lille',
    'Liverpool':'Liverpool FC',
    'Paris Saint-Germain':'Paris Saint Germain',
    'Sporting CP':'Sporting Lisbon'
  };
  let cache={};
  try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')||{}}catch(e){cache={}}

  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const normalize=s=>String(s||'').toLowerCase().replace(/football club|fc|afc/g,'').replace(/[^a-z0-9]+/g,' ').trim();

  function apply(){
    document.querySelectorAll('.team-badge').forEach(img=>{
      const name=img.dataset.team;
      const src=cache[name];
      if(src && img.src!==src){
        img.onload=()=>img.classList.add('loaded');
        img.onerror=()=>img.classList.remove('loaded');
        img.src=src;
      }
    });
  }

  async function getJson(url){
    const r=await fetch(url,{cache:'force-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }

  async function seedPremierLeague(){
    try{
      const j=await getJson(API+'/search_all_teams.php?l=English_Premier_League');
      (j.teams||[]).forEach(t=>{
        if(!t.strBadge) return;
        const names=[t.strTeam].concat((t.strTeamAlternate||'').split(',').map(x=>x.trim()).filter(Boolean));
        names.forEach(n=>{
          const target=[...document.querySelectorAll('.team-badge')].find(el=>normalize(el.dataset.team)===normalize(n));
          if(target) cache[target.dataset.team]=t.strBadge;
        });
      });
    }catch(e){}
  }

  async function lookup(name){
    try{
      const q=encodeURIComponent(aliases[name]||name);
      const j=await getJson(API+'/searchteams.php?t='+q);
      const team=(j.teams||[]).find(t=>t.strSport==='Soccer') || (j.teams||[])[0];
      if(team?.strBadge) cache[name]=team.strBadge;
    }catch(e){}
  }

  async function hydrate(){
    apply();
    await seedPremierLeague();
    apply();

    const names=[...new Set([...document.querySelectorAll('.team-badge')].map(x=>x.dataset.team))];
    const missing=names.filter(n=>!cache[n]);
    for(const n of missing){
      await lookup(n);
      apply();
      await wait(120);
    }
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}
    apply();
  }

  const originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(){
      originalRender();
      setTimeout(hydrate,0);
    };
  }
  hydrate();
})();
</script>
