function render(){

const wstate=(v,kind)=>{if(v==='待官方公布')return 'state-wait';if(v==='不适用')return 'state-na';if(kind==='result')return 'state-result';if(/2026|2027/.test(v))return kind==='open'?'state-open':'state-closed';return 'state-result'};
